[limits]
max_model_requests = 8
request_timeout_secs = 60
max_output_tokens = 8192
max_file_bytes = 16384

# Connection and authentication belong to the provider and are shared by all
# of its models. The base URL does not include /responses or /models.
[providers.example]
base_url = "https://api.openai.com/v1"
protocol = "openai-responses"
api_key = ""

# This optional table enables hybrid discovery. The provider catalog is used
# to validate configured models, but never overwrites or deletes them.
[providers.example.discovery]
path = "models"
on_missing = "warn"       # allow | warn | error
on_deprecated = "warn"    # ignore | warn | error
on_error = "use-config"   # use-config | error

[logging]
level = "info"
directory = "logs"
